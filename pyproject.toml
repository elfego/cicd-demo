[project]
name = "sorting-demo"
version = "0.1.0"
description = "A silly sorting library used to demonstrate CI/CD with GitHub Actions"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sorting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["perf: performance budget tests (slower)"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
